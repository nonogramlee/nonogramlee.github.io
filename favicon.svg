<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="12" fill="#2563EB"/>
  <rect x="8" y="8" width="48" height="48" rx="6" fill="#FFFFFF"/>
  <!-- 4x4 grid lines -->
  <g stroke="#9CA3AF" stroke-width="0.8">
    <line x1="20" y1="8" x2="20" y2="56"/>
    <line x1="32" y1="8" x2="32" y2="56"/>
    <line x1="44" y1="8" x2="44" y2="56"/>
    <line x1="8" y1="20" x2="56" y2="20"/>
    <line x1="8" y1="32" x2="56" y2="32"/>
    <line x1="8" y1="44" x2="56" y2="44"/>
  </g>
  <rect x="8" y="8" width="48" height="48" rx="6" fill="none" stroke="#1F2937" stroke-width="2.5"/>
  <!-- Filled cells -->
  <rect x="9" y="9" width="10" height="10" fill="#111827"/>
  <rect x="21" y="9" width="10" height="10" fill="#111827"/>
  <rect x="33" y="9" width="10" height="10" fill="#111827"/>
  <rect x="33" y="21" width="10" height="10" fill="#111827"/>
  <rect x="33" y="33" width="10" height="10" fill="#111827"/>
  <rect x="9" y="33" width="10" height="10" fill="#111827"/>
  <!-- X marks -->
  <g stroke="#DC2626" stroke-width="2.5" stroke-linecap="round">
    <line x1="11" y1="47" x2="17" y2="53"/>
    <line x1="17" y1="47" x2="11" y2="53"/>
    <line x1="47" y1="47" x2="53" y2="53"/>
    <line x1="53" y1="47" x2="47" y2="53"/>
  </g>
</svg>
